; GPS L1 C/A + L5 in real time from a Real Digital RFSoC 4x2 through
; uhd-rfsoc (https://github.com/WeiCheng14159/uhd-rfsoc): RF channel 0 (ADC A)
; at L1, RF channel 1 (ADC B) at L5, both in the first Nyquist zone.
;
; Before running:
;  * the uhd-rfsoc daemon serves on the board and the uhd_rfsoc UHD module is
;    installed on this host; channels=2 loads the 2-channel build (~16 s);
;  * one L1/L5 antenna + bias-tee + LNA, split to both ADC inputs (or one
;    antenna per band), with a band filter in front of each input;
;  * run as root, DPDK needs it:
;      uhd-rfsoc gnss-sdr --config_file=gnss-sdr_GPS_L1_L5_RFSoC4x2_realtime.conf
;
; L5 (10.23 Mchip/s) needs ~20 MS/s: both channels are decimated from
; 122.88 MS/s by 6 (FIR stages /3, /2, 60 dB alias rejection) to 20.48 MS/s,
; about 2.8 G multiply-accumulates per second per channel. Expect a high CPU
; load from acquisition and tracking at this rate as well.

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=20480000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=RFSoC_UHD_Signal_Source
SignalSource.device_address=192.168.1.50 ; <- the board's LAN (management) address
SignalSource.item_type=gr_complex
SignalSource.RF_channels=2
SignalSource.device_sampling_frequency=122880000
SignalSource.sampling_frequency=20480000
SignalSource.passband_hz=9000000
SignalSource.freq0=1575420000
SignalSource.gain0=0
SignalSource.samples0=0
SignalSource.dump0=false
SignalSource.freq1=1176450000
SignalSource.gain1=0
SignalSource.samples1=0
SignalSource.dump1=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner0.implementation=Pass_Through
SignalConditioner1.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8
Channels_L5.count=8
Channels_1C.RF_channel_ID=0
Channels_L5.RF_channel_ID=1
Channels.in_acquisition=1

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=1

Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.acquire_pilot=true
Acquisition_L5.coherent_integration_time_ms=1
Acquisition_L5.pfa=0.01
Acquisition_L5.doppler_max=8000
Acquisition_L5.doppler_step=250
Acquisition_L5.max_dwells=1

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5

Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type=gr_complex
Tracking_L5.track_pilot=true
Tracking_L5.pll_bw_hz=20.0
Tracking_L5.dll_bw_hz=2.0
Tracking_L5.early_late_space_chips=0.5

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.num_bands=2
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.flag_rtcm_server=false
