; GPS L1 C/A in real time from a Real Digital RFSoC 4x2 served as a UHD device
; by uhd-rfsoc (https://github.com/WeiCheng14159/uhd-rfsoc), over 100 GbE.
;
; Before running:
;  * the uhd-rfsoc daemon serves on the board (./run_daemon.sh) and the
;    uhd_rfsoc UHD module is installed on this host (see its README);
;  * RF front end on ADC input A: active L1 antenna + bias-tee (the RFSoC
;    has no bias voltage), ~20 dB extra LNA gain and an L1 SAW filter;
;  * run as root, DPDK needs it:
;      uhd-rfsoc gnss-sdr --config_file=gnss-sdr_GPS_L1_RFSoC4x2_realtime.conf
;
; The board streams 122.88 MS/s (its lowest rate at fs 4915.2 MS/s); the
; signal source decimates by 32 to 3.84 MS/s (FIR stages /8, /2, /2, 60 dB alias
; rejection, about 0.8 G multiply-accumulates per second).

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=3840000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=RFSoC_UHD_Signal_Source
SignalSource.device_address=192.168.1.50 ; <- the board's LAN (management) address
SignalSource.item_type=gr_complex
SignalSource.RF_channels=1
SignalSource.device_sampling_frequency=122880000
SignalSource.sampling_frequency=3840000
SignalSource.passband_hz=1500000
SignalSource.freq=1575420000
SignalSource.gain=0 ; RFDC attenuation, -27 .. 0 dB
SignalSource.samples=0
SignalSource.dump=false
SignalSource.dump_filename=./rfsoc_l1_3840ksps.dat

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8
Channels.in_acquisition=1
Channel.signal=1C

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
; the board's reference adds about 1.6 kHz of apparent Doppler per ppm
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Acquisition_1C.max_dwells=1

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.early_late_space_chips=0.5

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.flag_rtcm_server=false
